<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>be-a-beacon with shadow root</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <div id=div>
        <template shadowrootmode="open">
            <template id='beacon' be-a-beacon></template>
            <be-hive></be-hive>
        </template>
    </div>
    <div id='target'></div>
    <script>
        div.shadowRoot.querySelector('#beacon').addEventListener('i-am-here', e => {
            target.setAttribute('mark', 'good');
        });
    </script>
    <be-hive>
        <script type=emc src="be-a-beacon/emc.mjs"></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</body>
</html>
